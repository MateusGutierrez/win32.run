<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d2e"/>
      <stop offset="0.45" stop-color="#051839"/>
      <stop offset="0.75" stop-color="#0a1b48"/>
      <stop offset="1" stop-color="#1387b8"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="11.4" fill="url(#g)" stroke="#0a1426" stroke-width="0.5"/>
  <!-- connecting rod -->
  <path d="M8.2 15.7L15.4 8.9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- large wheel -->
  <circle cx="15.4" cy="8.9" r="3.9" fill="#fff"/>
  <circle cx="15.4" cy="8.9" r="2.7" fill="#0b1c3a"/>
  <circle cx="15.4" cy="8.9" r="1.9" fill="#fff"/>
  <!-- small wheel -->
  <circle cx="8.2" cy="15.7" r="2.6" fill="#fff"/>
  <circle cx="8.2" cy="15.7" r="1.5" fill="#0b1c3a"/>
  <circle cx="8.2" cy="15.7" r="0.9" fill="#fff"/>
  <!-- base arc (the "piston" side of the logo) -->
  <path d="M1.2 13.6l4.9 2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
